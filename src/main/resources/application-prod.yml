spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
server:
  forward-headers-strategy: none
  tomcat:
    max-connections: 512
    threads:
      max: 64
management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash

carrim:
  catalog:
    external-enabled: ${CARRIM_CATALOG_EXTERNAL_ENABLED:false}
